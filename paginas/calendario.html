    <!-- FullCalendar Core & Plugins via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/ical@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
    <title>Página Inicial</title>
</head>
    <body>
        <div class="fundo-fixo" style="background-image: url('../imagens/banner2.png');"></div>

        <div class="conteudo-site">
            <header>
                <div class="h-esq">
                    <img src="../imagens/logo.png" class='logotipo' height="100px" onclick="goto('../paginas/index.html')">
                </div>
                <div class="h-dir">
                    <button class="menu-mobile-btn" id="btn-menu" aria-label="Abrir Menu">
                    </button>
                    <nav class="nav-menu" id="nav-menu">
                        <a href="oalojamento.html">O Alojamento</a> 
                        <a href="experiencias.html">Experiências</a> 
                        <a href="contactos.html">Contactos</a>
                        <a href="calendario.html">Reservar</a>
                    </nav>
                </div>
            </header>

            <div class="titulo">
                <div class="conteudo-titulo">
                    <h1>Calendario</h1>
                </div>
            </div>
            
            <div class="conteudoB">
                <h1>Calendário de Disponibilidade</h1>
                <section class="seccao-calendario">                    
                    <div id="meu-calendario"></div>
                </section>

                <form id="bookingForm" action="">
                    <input type="date" name="checkin" style="display: none;" required>
                    <input type="date" name="checkout" style="display: none;" required>
                    <input type="number" name="numberOfAdults" value="0" required>
                    <input type="number" name="numberOfChildren" value="0" required>
                    <input type="number" name="numberOfInfants" value="0" required>
                    <input type="submit" value="Reservar pelo Airbnb">
                </form>
            </div>
            <script>
                const form = document.getElementById('bookingForm');

                form.addEventListener('submit', (event) => {
                    event.preventDefault();

                    const checkin = form.querySelector('input[name="checkin"]').value;
                    const checkout = form.querySelector('input[name="checkout"]').value;
                    const adults = parseInt(form.querySelector('input[name="numberOfAdults"]').value) || 1;
                    const children = parseInt(form.querySelector('input[name="numberOfChildren"]').value) || 0;
                    const infants = parseInt(form.querySelector('input[name="numberOfInfants"]').value) || 0;

                    // O total de hóspedes (convidados) é a soma de adultos e crianças
                    const guests = adults + children;

                    // ID do teu anúncio no Airbnb
                    const roomId = '1193985038143849991';

                    // Monta a URL de reserva no formato correto do Airbnb
                    const destinationUrl = `https://www.airbnb.pt/book/stays/${roomId}?checkin=${checkin}&checkout=${checkout}&numberOfAdults=${adults}&numberOfChildren=${children}&numberOfInfants=${infants}&numberOfGuests=${guests}&productId=${roomId}`;

                    // Redireciona para o Airbnb
                    window.location.href = destinationUrl;
                });
                </script>

        </div>
    </body>
</html>
